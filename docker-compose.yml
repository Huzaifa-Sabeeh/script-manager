services:
  script-manager:
    build: .
    container_name: script-manager
    user: "${APP_UID:-1001}:${APP_GID:-1001}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:19000:19000"
    env_file:
      - .env
    environment:
      - HOME=${HOST_HOME:-/home/ubuntu}
    volumes:
      - ${HOST_HOME:-/home/ubuntu}:${HOST_HOME:-/home/ubuntu}
      - /var/run/docker.sock:/var/run/docker.sock
